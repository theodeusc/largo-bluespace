situation: |
  Over centuries the waters of Largo Bay have been utilised as a resource (whether for commerce or recreation) yet have been gradually contaminated by industry and agriculture on the land. Today agricultural runoff is compounded by sewage and the significant problem of litter, regarded by the community as 'a hazard', and the plastics and polystyrene that wash up on the beach is much worse after a storm. The Largo Bay community hope the wastewater treatment facility will mean they 'meet bathing water quality standards completely', ensuring the water of Largo Bay would not 'potentially make [them] seriously ill'. As well as the benefit to the human community, there is a strong desire to ensure a healthy environment for the non-human visitors to these waters: oysters, seals, and seagrass.
  Over **10 rounds**, with **2 actions per round** and **0 starting credits**, you must control pollution levels and keep the bay healthy enough to save the reintroduced oysters from disappearing.
gameplay_summary: |
  Balance short-term cleanup of litter and fundraising with the long-term investment in a Water Treatment Facility. Watch the aggregate pollution tier — when the bay turns dirty, collecting and eating the oysters makes people sick, and three sicknesses ends the game.

info_card:
  title: What is a "catchment"?
  image: cover.jpg
  body: |
    A catchment is the area of land where every drop of rain flows downhill to a single body of water — a river, lake, or bay.

    Whatever happens on the land — farming, sewage, storm drains — eventually ends up in the water at the bottom, carrying bacteria, nutrients and soil with it. The Largo catchment funnels two rivers into one coastal bay.

actions_intro: |
  You can perform limited **actions** each round to meet your **Objectives**.

  You can **Forage** oysters from the bay, **Pick Litter** from the beach and rivers, **Fundraise** to grow your budget, and once you've saved enough, invest in **Wastewater Treatment Facility** that cleans the water in the rivers before it runs into the bay. Understanding how pollution travels from the rivers into the bay — and how treatment reverses it — is the heart of your strategy.

entity_descriptions:
  WaterPollution: |
    The bay's aggregate pollution readout. Largo's water is modelled from three kinds of pollution at once — microbial (E. coli from sewage and farmland), chemical (phosphorus, both particulate and soluble), and physical (sediment washed off the land). This readout follows the microbial and phosphorus load; sediment shows itself in the colour of the water and in how well the seagrass holds on. While it reads MED or HIGH, the water is unsafe to forage for oysters.
  Litter: |
    Plastic and debris collecting along the beach and rivers. Pair "Pick Litter" with "Fundraise" the same turn for a +20 credit combo bonus.
  Seal: |
    A resident harbour seal on the crescent beach. Seals only return while the bay's pollution reads LOW — watch the tier and you'll see them come and go.
  Currency: |
    Credits pay for the Wastewater Treatment Facility, which costs 140. **Fundraise** to grow your budget, and pair it with "Pick Litter" in the same turn for a +20 credit combo bonus. Foraging income alone cannot reach 140 before sickness ends the run.
  Oyster: |
    Filter-feeding shellfish that are the bay's ecological backbone. Each one sells for 1 credit. Foraging them while the water reads MED or HIGH makes people sick — three sicknesses ends the run. Leave at least 230 in the bay by the final round.

objectives:
  - title: Water Pollution Under Control
    entity: WaterPollution
    description: Bring catchment-wide water pollution down to LOW by the final round. Treatment is the only structural lever once late-round additions ramp up.
    goal: Aggregate pollution = LOW at the final round

  - title: Don't Overfish
    entity: Oyster
    description: Leave at least 230 oysters in the bay by the final round. Light-to-moderate foraging (up to ~5 cycles) is sustainable — greedy foraging crashes the bay.
    goal: Oyster population ≥ 230 at the final round

watch_out:
  - entity: WaterPollution
    name: Dirty-Water Sickness
    description: Eating oysters from polluted water makes people sick. Three sicknesses ends the game — always check the aggregate tier before foraging.
  - icon: clock_high_contrast
    name: Late Pollution Spike
    description: Pollution inputs ramp up from round 1 to round 5. If you haven't built the Water Treatment Facility by round 6, the bay may not recover in time.
  - icon: currency
    name: The Foraging-Only Trap
    description: Foraging income alone cannot reach the 140-credit treatment cost before sickness ends the run. The Pick Litter + Fundraise combo is the structural path to affording it.

why_this_matters: |
  Coastal bays around the world face the same pressures Largo models: rivers carrying pollutants in agricultural runoff, urban sewage, and storm-drain overflow into shallow waters where shellfish and seagrass live. Real bathing-water and shellfish standards are judged on several pollutants at once — bacterial contamination from sewage, excess phosphorus driving eutrophication, and suspended sediment that clouds the water and smothers seabed habitat. Between them they are leading causes of beach closures and shellfish-bed shutdowns worldwide.

  This scenario uses the same Lotka-Volterra population dynamics that ecologists use to study species interactions, plus a pollutant-movement model that mirrors how rivers transport contaminants downstream.

  Building a wastewater treatment facility is one of the most effective and most expensive interventions a community can make. The trade-off between paying now and cleaning up later is at the heart of real-world water policy.

  **Your decisions mirror the choices real stakeholders must make when balancing environmental restoration with limited budgets and community expectations.**

